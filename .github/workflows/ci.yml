name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags after v7
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
        env:
          # Browser tests skip locally when Chromium is missing; in CI they must run.
          PRUMI_REQUIRE_BROWSER: "1"
