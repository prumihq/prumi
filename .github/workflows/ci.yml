name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run prumi install-chromium --with-deps
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
        env:
          # Browser tests skip locally when Chromium is missing; in CI they must run.
          PRUMI_REQUIRE_BROWSER: "1"
          # The Postgres tests skip without a server; here the service container must be used.
          PRUMI_TEST_POSTGRES_HOST: localhost
          PRUMI_REQUIRE_POSTGRES: "1"
      # TEMPORARY: prints the Postgres timings for spikes/postgres-timing; removed once read.
      - name: Time the Postgres demo
        env:
          PGPASSWORD: prumi-reader-test
        run: |
          cat > "$RUNNER_TEMP/prumi.toml" <<EOF
          [server]
          port = 8484
          data_dir = "data"
          as_of = "2026-10-15"
          [source]
          adapter = "dbt"
          [source.dbt]
          semantic_manifest = "$GITHUB_WORKSPACE/examples/demo-dbt-project/target-postgres/semantic_manifest.json"
          [source.dbt.connection]
          type = "postgres"
          host = "localhost"
          port = 5432
          dbname = "prumi_demo"
          user = "prumi_reader"
          EOF
          for run in 1 2 3; do echo "run $run"; uv run python spikes/postgres-timing/measure.py "$RUNNER_TEMP/prumi.toml"; done

  install-check:
    # Prumi as users get it: both packages built, installed with `uv tool install "prumi[dbt]"`
    # into a temporary tool directory, and started on the demo (not part of `uv run pytest`).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run python scripts/check_install.py --with-deps
