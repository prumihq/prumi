name: Release

# A pushed tag v<version> checks, builds and uploads both packages to PyPI. A manual run
# does everything except the upload. The maintainer's checklist is docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    # Before building anything: the tag names the version of both packages, and the
    # CHANGELOG dates it. A manual run has no tag and checks the version both packages have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # no floating major tags after v7
      - run: uv run --no-project python scripts/check_release.py ${TAG:+"$TAG"}
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}

  checks:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run prumi install-chromium --with-deps
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
        env:
          PRUMI_REQUIRE_BROWSER: "1"

  build:
    # The install check runs on the very files the upload jobs get.
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv build --package prumi --out-dir dist
      - run: uv build --package prumi-adapter-dbt --out-dir dist
      - run: uv run python scripts/check_install.py --dist dist --with-deps
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # One upload job per package, each in that package's own environment: PyPI trusts this
  # workflow (trusted publishing) per project and environment, and accepts only one pending
  # publisher for the same repository, workflow and environment. No token is stored anywhere.
  # --check-url skips files already on PyPI, so rerunning a failed job finishes its upload.
  upload-prumi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/prumi-*

  upload-prumi-adapter-dbt:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi-adapter-dbt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/prumi_adapter_dbt-*
