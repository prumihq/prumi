name: Release

# The tag v<version> comes from the merged release PR (release-please), which also leaves a
# draft GitHub Release. Pushing the tag checks, builds and uploads both packages to PyPI, builds
# both images from them and pushes them to GHCR, then publishes the draft. A manual run does
# everything except the upload, the images and the publishing.
# The maintainer's manual is docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tag:
    # Before building anything: the tag names the version of both packages, and the
    # CHANGELOG dates it. A manual run has no tag and checks the version both packages have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run --no-project python scripts/check_release.py ${TAG:+"$TAG"}
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}

  checks:
    needs: tag
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run prumi install-chromium --with-deps
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest
        env:
          PRUMI_REQUIRE_BROWSER: "1"
          # The Postgres tests skip without a server; here the service container must be used.
          PRUMI_TEST_POSTGRES_HOST: localhost
          PRUMI_REQUIRE_POSTGRES: "1"

  build:
    # The install check runs on the very files the upload jobs get.
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv build --package prumi --out-dir dist
      - run: uv build --package prumi-adapter-dbt --out-dir dist
      - run: uv run python scripts/check_install.py --dist dist --with-deps
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # One upload job per package, each in that package's own environment: PyPI trusts this
  # workflow (trusted publishing) per project and environment, and accepts only one pending
  # publisher for the same repository, workflow and environment. No token is stored anywhere.
  # --check-url skips files already on PyPI, so rerunning a failed job finishes its upload.
  upload-prumi:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/prumi-*

  upload-prumi-adapter-dbt:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi-adapter-dbt
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv publish --trusted-publishing always --check-url https://pypi.org/simple/ dist/prumi_adapter_dbt-*

  # The images install the released packages from PyPI, so users get the same code either way.
  # The smoke test runs on an amd64 copy in the runner's own builder, where the demo image's FROM
  # finds the main image locally; the pushed images are then built for both architectures.
  images:
    needs: [upload-prumi, upload-prumi-adapter-dbt]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ github.ref_name }}
      # PyPI can take a few minutes to serve a new upload; --refresh skips uv's cache.
      - timeout-minutes: 10
        run: |
          until echo "prumi[dbt]==$VERSION" \
              | uv pip compile - --refresh --quiet --python-version 3.12 > /dev/null; do
            sleep 20
          done
      - run: >-
          docker buildx build --platform linux/amd64 --load
          --file deploy/image/Dockerfile --build-arg PRUMI_VERSION="$VERSION"
          --tag prumi:smoke .
      - run: >-
          docker buildx build --platform linux/amd64 --load
          --file deploy/demo-image/Dockerfile --build-arg PRUMI_IMAGE=prumi:smoke
          --tag prumi-demo:smoke .
      - run: uv run --locked python scripts/check_images.py --image prumi:smoke --demo-image prumi-demo:smoke
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # From here on buildx uses its own builder, which can build for arm64 but can't see the
      # local images, so the smoke test above stays before it.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The demo is built on the main image just pushed, of the same version.
      - run: >-
          docker buildx build --platform linux/amd64,linux/arm64 --push
          --file deploy/image/Dockerfile --build-arg PRUMI_VERSION="$VERSION"
          --tag "ghcr.io/prumihq/prumi:$VERSION" --tag ghcr.io/prumihq/prumi:latest .
      - run: >-
          docker buildx build --platform linux/amd64,linux/arm64 --push
          --file deploy/demo-image/Dockerfile
          --build-arg PRUMI_IMAGE="ghcr.io/prumihq/prumi:$VERSION"
          --tag "ghcr.io/prumihq/prumi-demo:$VERSION" --tag ghcr.io/prumihq/prumi-demo:latest .

  # The compose files are attached to the draft before it is published, so the release never
  # points to a file or image that isn't there. They name the image pushed above.
  compose-assets:
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GitHub renames an asset whose name starts with a period (.env.example would become
      # default.env.example), so .../download/.env.example would 404. The example goes up as
      # env.example, and the install docs save it as .env.example.
      - run: |
          cp deploy/compose/.env.example "$RUNNER_TEMP/env.example"
          gh release upload "$TAG" deploy/compose/docker-compose.yml "$RUNNER_TEMP/env.example" \
            --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  # The release stays a draft until PyPI has both packages, GHCR both images and the release
  # its compose files, so nobody sees a release whose files are missing. Publishing it is also
  # what makes it immutable.
  publish-release:
    needs: [upload-prumi, upload-prumi-adapter-dbt, images, compose-assets]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
