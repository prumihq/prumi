[project]
name = "prumi-core"
version = "0.1.0.dev0"
description = "Prumi server: MCP endpoint, catalog, query engine, validator and registry"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
]

[project.scripts]
prumi = "prumi.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prumi"]
