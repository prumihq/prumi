<!doctype html>
<!-- A total summed in JavaScript: customers is a distinct count, so the weeks don't add up. -->
<html>
<head><meta charset="utf-8"><title>Customers</title></head>
<body>
  <h1>Customers, last 12 weeks</h1>
  <p>All weeks: <b id="total"></b></p>
  <table id="weeks"></table>
  <script>
    prumi.on("weekly", function (b) {
      var sum = 0;
      document.getElementById("weeks").innerHTML = b.rows.map(function (row) {
        sum += row.customers;
        return "<tr><td>" + row.metric_time + "</td><td>" + prumi.format(row.customers, "customers") + "</td></tr>";
      }).join("");
      document.getElementById("total").textContent = prumi.format(sum, "customers");
    });
  </script>
</body>
</html>
