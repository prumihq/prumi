# A dashboard on the demo project, used by the CLI, server and browser tests.
spec_version: 0
dashboard: {id: sales, title: Sales}
filters:
  - {id: period, type: time, default: {last: 12, grain: week}}
  - {id: region, type: dimension, dimension: customer__region, default: []}
data:
  - id: kpi
    metrics: [revenue, average_order_value]
    filters: [period, region]
  - id: by_region
    metrics: [revenue, gross_margin_pct]
    dimensions: [customer__region]
    filters: [period]
    sort: {by: revenue, descending: true}
    top_n: 5
    others: true
    total: true
  - id: trend
    metrics: [revenue]
    time_grain: week
    filters: [period, region]
interactions:
  - {from: by_region, on: click, sets_filter: region}
presentation:
  bindings: {"#kpi": kpi, "#regions": by_region, "#trend": trend}
