<!doctype html>
<html>
<head><meta charset="utf-8"><title>Failing</title></head>
<body>
  <div id="kpi">Loading…</div>
  <ol id="trend">Loading…</ol>
  <p id="trend-note">Loading…</p>
  <script>
    prumi.on("kpi", function (b) {
      document.getElementById("kpi").textContent = b.rows[0].missing.value;
    });
    prumi.on("trend", function (b) {
      document.getElementById("trend").textContent = b.rows.length + " weeks";
      document.getElementById("trend-note").textContent = "";
    });
  </script>
</body>
</html>
