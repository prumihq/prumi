[project]
name = "prumi-adapter-dbt"
version = "0.1.0.dev0"
description = "Prumi adapter for dbt semantic models: MetricFlow compiles, Prumi executes"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["prumi-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prumi_adapter_dbt"]
