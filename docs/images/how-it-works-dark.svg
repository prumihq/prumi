<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>How Prumi works: the agent designs over MCP, Prumi gets the numbers from your semantic layer, checks the page and serves it, the data team certifies it</title>

<defs>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9198a1"/></marker>
<marker id="a-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#bc8cff"/></marker>
<marker id="a-num" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#58a6ff"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/></marker>
</defs>
<rect x="335" y="40" width="290" height="280" rx="12" fill="#151b23" stroke="#e6edf3" stroke-width="2.5"/>
<text x="480.0" y="80" font-size="24" font-weight="800" text-anchor="middle" fill="#e6edf3">Prumi</text>
<line x1="353" y1="104" x2="607" y2="104" stroke="#3d444d"/>
<text x="383" y="126" font-size="14" fill="#e6edf3">Catalog of official metrics</text>
<line x1="353" y1="142" x2="607" y2="142" stroke="#3d444d"/>
<circle cx="365" cy="160" r="10" fill="#e6edf3"/><text x="365" y="164.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0d1117">3</text>
<text x="383" y="164" font-size="14" fill="#e6edf3">Checks BI rules R1–R10</text>
<line x1="353" y1="180" x2="607" y2="180" stroke="#3d444d"/>
<text x="383" y="202" font-size="14" fill="#e6edf3">Renders it with real data</text>
<line x1="353" y1="218" x2="607" y2="218" stroke="#3d444d"/>
<text x="383" y="240" font-size="14" fill="#e6edf3">Checks every number shown</text>
<line x1="353" y1="256" x2="607" y2="256" stroke="#3d444d"/>
<text x="383" y="278" font-size="14" fill="#e6edf3">Drafts and certified versions</text>
<rect x="20" y="130" width="180" height="100" rx="10" fill="#151b23" stroke="#bc8cff" stroke-width="2"/>
<text x="110.0" y="165.0" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">Your AI agent</text>
<text x="110.0" y="187.0" font-size="13" text-anchor="middle" fill="#9198a1">Claude Code or</text>
<text x="110.0" y="205.0" font-size="13" text-anchor="middle" fill="#9198a1">another MCP client</text>
<text x="110" y="260" font-size="13" font-weight="400" text-anchor="middle" fill="#bc8cff">Gets metric definitions and</text><text x="110" y="277" font-size="13" font-weight="400" text-anchor="middle" fill="#bc8cff">the shape of the data,</text>
<text x="110" y="294" font-size="13" font-weight="700" text-anchor="middle" fill="#bc8cff">never the values</text>
<line x1="202" y1="180" x2="331" y2="180" stroke="#bc8cff" stroke-width="2" marker-end="url(#a-agent)"/>
<text x="266" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#bc8cff">MCP</text>
<circle cx="224" cy="132" r="10" fill="#bc8cff"/><text x="224" y="136.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0d1117">1</text>
<text x="240" y="136" font-size="13" font-weight="400" text-anchor="start" fill="#9198a1">find metrics,</text>
<text x="266" y="153" font-size="13" font-weight="400" text-anchor="middle" fill="#9198a1">learn the shape</text>
<circle cx="224" cy="208" r="10" fill="#bc8cff"/><text x="224" y="212.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0d1117">2</text>
<text x="240" y="212" font-size="13" font-weight="400" text-anchor="start" fill="#9198a1">validate and</text>
<text x="266" y="229" font-size="13" font-weight="400" text-anchor="middle" fill="#9198a1">publish the page</text>
<rect x="770" y="40" width="170" height="70" rx="10" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/>
<text x="855.0" y="70.0" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">Semantic layer</text>
<text x="855.0" y="92.0" font-size="13" text-anchor="middle" fill="#9198a1">dbt / MetricFlow</text>
<rect x="770" y="150" width="170" height="70" rx="10" fill="#151b23" stroke="#58a6ff" stroke-width="1.5"/>
<text x="855.0" y="180.0" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">Warehouse</text>
<text x="855.0" y="202.0" font-size="13" text-anchor="middle" fill="#9198a1">your data</text>
<rect x="770" y="260" width="170" height="70" rx="10" fill="#151b23" stroke="#58a6ff" stroke-width="1.5"/>
<text x="855.0" y="290.0" font-size="17" font-weight="700" text-anchor="middle" fill="#e6edf3">Browser</text>
<text x="855.0" y="312.0" font-size="13" text-anchor="middle" fill="#9198a1">viewers</text>
<line x1="629" y1="75" x2="766" y2="75" stroke="#9198a1" stroke-width="2" marker-end="url(#a-muted)"/>
<text x="698" y="65" font-size="13" font-weight="400" text-anchor="middle" fill="#9198a1">metric queries</text>
<line x1="766" y1="185" x2="629" y2="185" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a-num)"/>
<text x="698" y="175" font-size="13" font-weight="700" text-anchor="middle" fill="#58a6ff">numbers</text>
<line x1="629" y1="295" x2="766" y2="295" stroke="#58a6ff" stroke-width="2.5" marker-end="url(#a-num)"/>
<circle cx="658" cy="280" r="10" fill="#58a6ff"/><text x="658" y="284.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0d1117">4</text>
<text x="674" y="284" font-size="13" font-weight="700" text-anchor="start" fill="#58a6ff">dashboard</text>
<text x="698" y="316" font-size="13" font-weight="400" text-anchor="middle" fill="#58a6ff">numbers checked</text>
<text x="855" y="360" font-size="13" font-weight="700" text-anchor="middle" fill="#58a6ff">The data never passes</text><text x="855" y="377" font-size="13" font-weight="700" text-anchor="middle" fill="#58a6ff">through the agent</text>
<rect x="380" y="360" width="200" height="50" rx="10" fill="#151b23" stroke="#3fb950" stroke-width="2"/>
<text x="480.0" y="390.0" font-size="16" font-weight="700" text-anchor="middle" fill="#e6edf3">Data team</text>
<line x1="480" y1="358" x2="480" y2="324" stroke="#3fb950" stroke-width="2" marker-end="url(#a-ok)"/>
<circle cx="500" cy="341" r="10" fill="#3fb950"/><text x="500" y="345.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#0d1117">5</text>
<text x="516" y="345" font-size="13" font-weight="700" text-anchor="start" fill="#3fb950">certifies</text>
</svg>
