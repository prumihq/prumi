<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" role="img">
<title>How Prumi works: the agent designs over MCP, Prumi gets the numbers from your semantic layer, checks the page and serves it, the data team certifies it</title>

<defs>
<marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker>
<marker id="a-agent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8250df"/></marker>
<marker id="a-num" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker>
<marker id="a-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker>
</defs>
<rect x="335" y="40" width="290" height="280" rx="12" fill="#f6f8fa" stroke="#1f2328" stroke-width="2.5"/>
<text x="480.0" y="80" font-size="24" font-weight="800" text-anchor="middle" fill="#1f2328">Prumi</text>
<line x1="353" y1="104" x2="607" y2="104" stroke="#d1d9e0"/>
<text x="383" y="126" font-size="14" fill="#1f2328">Catalog of official metrics</text>
<line x1="353" y1="142" x2="607" y2="142" stroke="#d1d9e0"/>
<circle cx="365" cy="160" r="10" fill="#1f2328"/><text x="365" y="164.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="383" y="164" font-size="14" fill="#1f2328">Checks BI rules R1–R10</text>
<line x1="353" y1="180" x2="607" y2="180" stroke="#d1d9e0"/>
<text x="383" y="202" font-size="14" fill="#1f2328">Renders it with real data</text>
<line x1="353" y1="218" x2="607" y2="218" stroke="#d1d9e0"/>
<text x="383" y="240" font-size="14" fill="#1f2328">Checks every number shown</text>
<line x1="353" y1="256" x2="607" y2="256" stroke="#d1d9e0"/>
<text x="383" y="278" font-size="14" fill="#1f2328">Drafts and certified versions</text>
<rect x="20" y="130" width="180" height="100" rx="10" fill="#f6f8fa" stroke="#8250df" stroke-width="2"/>
<text x="110.0" y="165.0" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2328">Your AI agent</text>
<text x="110.0" y="187.0" font-size="13" text-anchor="middle" fill="#59636e">Claude Code or</text>
<text x="110.0" y="205.0" font-size="13" text-anchor="middle" fill="#59636e">another MCP client</text>
<text x="110" y="260" font-size="13" font-weight="400" text-anchor="middle" fill="#8250df">Gets metric definitions and</text><text x="110" y="277" font-size="13" font-weight="400" text-anchor="middle" fill="#8250df">the shape of the data,</text>
<text x="110" y="294" font-size="13" font-weight="700" text-anchor="middle" fill="#8250df">never the values</text>
<line x1="202" y1="180" x2="331" y2="180" stroke="#8250df" stroke-width="2" marker-end="url(#a-agent)"/>
<text x="266" y="170" font-size="12" font-weight="700" text-anchor="middle" fill="#8250df">MCP</text>
<circle cx="224" cy="132" r="10" fill="#8250df"/><text x="224" y="136.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="240" y="136" font-size="13" font-weight="400" text-anchor="start" fill="#59636e">find metrics,</text>
<text x="266" y="153" font-size="13" font-weight="400" text-anchor="middle" fill="#59636e">learn the shape</text>
<circle cx="224" cy="208" r="10" fill="#8250df"/><text x="224" y="212.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="240" y="212" font-size="13" font-weight="400" text-anchor="start" fill="#59636e">validate and</text>
<text x="266" y="229" font-size="13" font-weight="400" text-anchor="middle" fill="#59636e">publish the page</text>
<rect x="770" y="40" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/>
<text x="855.0" y="70.0" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2328">Semantic layer</text>
<text x="855.0" y="92.0" font-size="13" text-anchor="middle" fill="#59636e">dbt / MetricFlow</text>
<rect x="770" y="150" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
<text x="855.0" y="180.0" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2328">Warehouse</text>
<text x="855.0" y="202.0" font-size="13" text-anchor="middle" fill="#59636e">your data</text>
<rect x="770" y="260" width="170" height="70" rx="10" fill="#f6f8fa" stroke="#0969da" stroke-width="1.5"/>
<text x="855.0" y="290.0" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2328">Browser</text>
<text x="855.0" y="312.0" font-size="13" text-anchor="middle" fill="#59636e">viewers</text>
<line x1="629" y1="75" x2="766" y2="75" stroke="#59636e" stroke-width="2" marker-end="url(#a-muted)"/>
<text x="698" y="65" font-size="13" font-weight="400" text-anchor="middle" fill="#59636e">metric queries</text>
<line x1="766" y1="185" x2="629" y2="185" stroke="#0969da" stroke-width="2.5" marker-end="url(#a-num)"/>
<text x="698" y="175" font-size="13" font-weight="700" text-anchor="middle" fill="#0969da">numbers</text>
<line x1="629" y1="295" x2="766" y2="295" stroke="#0969da" stroke-width="2.5" marker-end="url(#a-num)"/>
<circle cx="658" cy="280" r="10" fill="#0969da"/><text x="658" y="284.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="674" y="284" font-size="13" font-weight="700" text-anchor="start" fill="#0969da">dashboard</text>
<text x="698" y="316" font-size="13" font-weight="400" text-anchor="middle" fill="#0969da">numbers checked</text>
<text x="855" y="360" font-size="13" font-weight="700" text-anchor="middle" fill="#0969da">The data never passes</text><text x="855" y="377" font-size="13" font-weight="700" text-anchor="middle" fill="#0969da">through the agent</text>
<rect x="380" y="360" width="200" height="50" rx="10" fill="#f6f8fa" stroke="#1a7f37" stroke-width="2"/>
<text x="480.0" y="390.0" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2328">Data team</text>
<line x1="480" y1="358" x2="480" y2="324" stroke="#1a7f37" stroke-width="2" marker-end="url(#a-ok)"/>
<circle cx="500" cy="341" r="10" fill="#1a7f37"/><text x="500" y="345.5" font-size="12.5" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
<text x="516" y="345" font-size="13" font-weight="700" text-anchor="start" fill="#1a7f37">certifies</text>
</svg>
