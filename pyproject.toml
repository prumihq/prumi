[project]
name = "prumi-workspace"
version = "0.0.0"
requires-python = ">=3.12"
description = "Workspace root for Prumi (not published)"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/prumi-core",
    "packages/prumi-adapter-dbt",
]
# Spikes and examples are standalone projects with their own dependencies.
exclude = ["spikes/*", "examples/*"]

[tool.uv.sources]
prumi = { workspace = true }
prumi-adapter-dbt = { workspace = true }

[dependency-groups]
dev = [
    "prumi",
    "prumi-adapter-dbt[duckdb]",
    "httpx2",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
# Code blocks in specs are illustrations; `ruff format` must never rewrite an accepted spec.
exclude = ["specs/**"]

[tool.pytest.ini_options]
testpaths = ["packages", "examples/demo-dbt-project/tests"]
addopts = "--import-mode=importlib"
markers = [
    "demo: needs the built demo dbt project (added to every test that uses `demo_project`)",
    "browser: drives headless Chromium with Playwright (skipped when Chromium isn't installed)",
]
