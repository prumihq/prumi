[project]
name = "prumi-workspace"
version = "0.0.0"
requires-python = ">=3.12"
description = "Workspace root for Prumi (not published)"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/prumi-core",
    "packages/prumi-adapter-dbt",
]

[tool.uv.sources]
prumi-core = { workspace = true }
prumi-adapter-dbt = { workspace = true }

[dependency-groups]
dev = [
    "prumi-core",
    "prumi-adapter-dbt",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "--import-mode=importlib"
